services:
  - type: web
    name: cryptorot-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --no-access-log
    envVars:
      - key: CR_ORIGINS
        value: https://cryptorot.vercel.app
      - key: CR_RATE
        value: "30"
